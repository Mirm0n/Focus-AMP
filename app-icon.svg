<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262320"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The faceplate: the chassis of a hi-fi separate, which is what the app draws. -->
  <rect x="0" y="0" width="1024" height="1024" rx="212" fill="url(#face)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="206" fill="none"
        stroke="#4d463d" stroke-width="10" opacity="0.65"/>

  <!-- Dial lamp behind the glass. -->
  <circle cx="512.0" cy="512.0" r="330" fill="url(#lamp)"/>

  <!-- Unlit track, then the elapsed arc over it: a tuner dial and a timer at once. -->
  <path d="M 277.2 746.8 A 332 332 0 1 1 746.8 746.8" fill="none" stroke="#2c2b28"
        stroke-width="74" stroke-linecap="round"/>
  <path d="M 277.2 746.8 A 332 332 0 1 1 780.6 316.9" fill="none" stroke="#e0553c"
        stroke-width="74" stroke-linecap="round"/>

    <line x1="345.1" y1="678.9" x2="316.8" y2="707.2" stroke="#e8a33d" stroke-width="26" stroke-linecap="round" opacity="1"/>
  <line x1="276.0" y1="512.0" x2="236.0" y2="512.0" stroke="#e8a33d" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <line x1="345.1" y1="345.1" x2="316.8" y2="316.8" stroke="#e8a33d" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <line x1="512.0" y1="276.0" x2="512.0" y2="236.0" stroke="#e8a33d" stroke-width="26" stroke-linecap="round" opacity="1"/>
  <line x1="678.9" y1="345.1" x2="707.2" y2="316.8" stroke="#e8a33d" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <line x1="748.0" y1="512.0" x2="788.0" y2="512.0" stroke="#e8a33d" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <line x1="678.9" y1="678.9" x2="707.2" y2="707.2" stroke="#e8a33d" stroke-width="26" stroke-linecap="round" opacity="1"/>

  <!-- The needle. -->
  <line x1="468.3" y1="543.7" x2="715.9" y2="363.9"
        stroke="#f1ece3" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512.0" cy="512.0" r="46" fill="#f1ece3"/>
  <circle cx="512.0" cy="512.0" r="20" fill="#121110"/>
</svg>
