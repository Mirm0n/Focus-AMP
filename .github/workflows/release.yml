## Builds the Windows installers for a version tag and puts them on a draft
## GitHub release.
##
## Draft, not published: 1.0 is meant to be signed through the SignPath
## Foundation (task S5), and until that is in place somebody should look at
## what came out and write the release notes before anyone downloads it. The
## beta (S3) ships unsigned and says so.
##
##   git tag v0.9.0 && git push origin v0.9.0
##
## Windows will warn about an unsigned installer. That is expected until
## signing is approved, and the release notes should say so plainly rather than
## leaving someone to wonder whether the download is safe.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms attach to the same draft release, so one failing must
      # not cancel the other — a half-built draft is easier to reason about
      # than a cancelled one.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installers
          # 22.04 rather than latest: the glibc an AppImage is built against
          # sets the oldest distribution it will run on, so building on the
          # older image reaches more people.
          - os: ubuntu-22.04
            label: Linux packages
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: npm ci

      # Fails the release rather than shipping a catalog that cannot account
      # for itself. Same gate as CI, stated here so it cannot be skipped by
      # tagging a commit that never ran CI.
      - name: Check the catalog
        run: npm run check:stations

      # And refuse to build an app wired to a placeholder updater endpoint,
      # which would leave every install of this version unable to ever find
      # an update. Nothing outside the app can fix that afterwards.
      - name: Check the release wiring
        run: npm run check:release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Without these the build still produces
          # installers, but no .sig files, so no usable latest.json — and an
          # app will refuse an update it cannot verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Focus AMP ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Writes latest.json beside the installers. This is the file the
          # endpoint in tauri.conf.json points at, so without it nothing
          # already installed ever learns that this release exists.
          includeUpdaterJson: true
          releaseBody: |
            Windows installers and Linux packages are attached below.

            **Windows:** the build is **not code-signed**, so SmartScreen will
            warn you: choose "More info" then "Run anyway". Signing is waiting
            on an application to the SignPath Foundation.

            **Linux:** take the `.deb`, `.rpm` or `.AppImage`. All three update
            themselves in place. Focus AMP plays MP3 and AAC streams through
            WebKitGTK, which needs the GStreamer codecs — the `.deb` asks for
            them, but with the AppImage or the `.rpm` install them yourself if
            stations connect and then stay silent:

            ```
            sudo apt install gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            ```

            Linux is newly supported and less tested than Windows; please
            report anything odd.

            Focus AMP is free software under GPL-3.0-or-later. It has no
            account and no telemetry. It contacts the station you are playing,
            GitHub once a launch to ask whether a newer version exists, and
            nothing else unless you turn on the community directory or album
            art. Every one of those is a setting.

            **A release stays a draft until it is published.** Publishing is
            what makes `latest.json` reachable at `releases/latest`, which is
            what offers this version to everyone already running the app.
