[package]
name = "tunescape-v2"
version = "0.1.0"
description = "Tunescape — a single-player desktop radio player"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tunescape_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local audio proxy
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
