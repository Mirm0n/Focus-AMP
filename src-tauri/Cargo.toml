[package]
name = "focus-amp"
version = "0.1.0"
description = "Focus AMP — a single-player desktop radio player"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[lib]
name = "focus_amp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
# About screen links: opens the browser rather than navigating the webview.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local audio proxy
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
# File picker for adding local audio.
tauri-plugin-dialog = "2"

# Windows attributes a toast to an AppUserModelID, not to a process; see
# src/notify.rs. Both versions are already in the lockfile.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
